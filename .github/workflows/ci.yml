name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

jobs:
  # Primary test job that runs the full make target (including linting) on all platforms
  make:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Prevent Go from silently upgrading past the go.mod toolchain installed
      # below (which breaks pinned staticcheck export-data compatibility).
      GOTOOLCHAIN: local
      # Exercise native process and pipe concurrency on every supported OS.
      GO_TEST_FLAGS: -race -count=1 -timeout=40m
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    # Derive the toolchain from go.mod rather than tracking `stable`. CI also
    # runs staticcheck, which go.mod pins in its tool directives, and a `stable`
    # bump moves Go ahead of the version staticcheck can read: run 120798918805
    # failed lint with `internal error in importing "cmp" (export data version 5
    # is greater than maximum supported version 4)` for every stdlib package.
    # Reading the module's own version with GOTOOLCHAIN=local keeps the
    # compiler and the lint tools in step.
    #
    # go-version-file honours the exact patch in the `go` directive (this
    # go.mod names 1.27.3 and has no `toolchain` line, so that is what CI
    # installs). Pinned actions/setup-go revision 40f1582b reads the `go`
    # directive rather than a `toolchain` directive.
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - name: Detect CPU count and run tests (Unix)
      if: runner.os != 'Windows'
      run: |
        if [ "$(uname)" = "Darwin" ]; then
          v="$(sysctl -n hw.logicalcpu)"
        else
          v="$(nproc)"
        fi
        [ -n "$v" ] && make -j "$v"
    - name: Detect CPU count and run tests (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $cpuCount = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
        if ($cpuCount -gt 0) {
          make -j $cpuCount
        } else {
          make
        }
