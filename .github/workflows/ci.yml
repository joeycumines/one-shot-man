name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

jobs:
  # Primary test job that runs the full make target (including linting) on all platforms
  make:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    # Derive the toolchain from go.mod rather than tracking `stable`. CI also
    # runs staticcheck, which go.mod pins in its tool directives, and a `stable`
    # bump moves Go ahead of the version staticcheck can read: run 120798918805
    # failed lint with `internal error in importing "cmp" (export data version 5
    # is greater than maximum supported version 4)` for every stdlib package.
    # Reading the module's own version keeps the compiler and the lint tools in
    # step.
    - name: Read Go version from go.mod
      id: go-version
      shell: bash
      run: |
        set -euo pipefail
        directive="$(awk '$1 == "go" { print $2; exit }' go.mod)"
        if [ -z "$directive" ]; then
          echo "could not read the go directive from go.mod" >&2
          exit 1
        fi
        # The go directive is a language version ("1.27.3"). setup-go resolves
        # a major.minor spec to the newest published patch of that line, which
        # is what we want: the point is to refuse a *minor* bump that outruns
        # staticcheck, not to pin a patch release that may not exist for every
        # runner image.
        minor="$(echo "$directive" | awk -F. '{ print $1 "." $2 }')"
        echo "version=$minor" >> "$GITHUB_OUTPUT"
        echo "using Go $minor (from go $directive in go.mod)"
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        check-latest: false
    - name: Detect CPU count and run tests (Unix)
      if: runner.os != 'Windows'
      run: |
        if [ "$(uname)" = "Darwin" ]; then
          v="$(sysctl -n hw.logicalcpu)"
        else
          v="$(nproc)"
        fi
        [ -n "$v" ] && make -j "$v"
    - name: Detect CPU count and run tests (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $cpuCount = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
        if ($cpuCount -gt 0) {
          make -j $cpuCount
        } else {
          make
        }
