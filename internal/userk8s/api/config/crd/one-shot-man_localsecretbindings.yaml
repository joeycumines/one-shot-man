---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: localsecretbindings.one-shot-man
spec:
  group: one-shot-man
  names:
    kind: LocalSecretBinding
    listKind: LocalSecretBindingList
    plural: localsecretbindings
    singular: localsecretbinding
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LocalSecretBinding is the local bridge between a Kubernetes Secret
          reference and the environment variable slots an access requires.
          Selector-matched to ModelAccess labels, it names the Secret key that holds
          the value in-cluster and the ordered resolver chain that produces the value
          locally (environment lookup, file read, or command execution — for example
          the 1Password CLI). Namespaced: credential material is machine- or
          tenant-local.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LocalSecretBindingSpec binds one environment variable slot to one Secret
              key plus an ordered local resolver chain.
            properties:
              envVar:
                description: |-
                  EnvVar is the environment variable slot this binding covers; an access
                  is resolvable only when every requiredEnv name has a matched binding.
                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                type: string
              resolvers:
                description: |-
                  Resolvers is the ordered local chain executed when the value is needed
                  outside a cluster; first success wins. Absent means the binding is
                  usable only with the Secret present.
                items:
                  description: |-
                    LocalSecretResolver is one step of an ordered resolver chain. Exactly one
                    of Env, File, or Command is set per step; the first step that yields a
                    non-empty value wins.
                  properties:
                    command:
                      description: CommandResolver produces a credential by executing
                        one command.
                      properties:
                        argv:
                          description: Argv is the exact argument vector, executed
                            without a shell.
                          items:
                            minLength: 1
                            type: string
                          minItems: 1
                          type: array
                        timeout:
                          default: 5s
                          description: Timeout bounds one execution attempt (e.g.
                            "5s").
                          type: string
                      required:
                      - argv
                      type: object
                    env:
                      description: EnvResolver reads a credential from one environment
                        variable.
                      properties:
                        name:
                          description: Name is the environment variable name.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    file:
                      description: FileResolver reads a credential from the first
                        line of one file.
                      properties:
                        path:
                          description: Path is the credential file path.
                          minLength: 1
                          type: string
                      required:
                      - path
                      type: object
                  type: object
                type: array
              secretRef:
                description: SecretRef names the in-cluster source of the value.
                properties:
                  key:
                    description: Key is the data key holding the credential value.
                    minLength: 1
                    type: string
                  name:
                    description: Name is the Secret name.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              selector:
                description: |-
                  Selector matches the ModelAccess labels this binding serves. Empty
                  selectors match everything and are rejected.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - envVar
            - secretRef
            - selector
            type: object
            x-kubernetes-validations:
            - message: spec.selector must declare a non-empty matchLabels or matchExpressions
                — an empty selector matches every access
              rule: (has(self.selector.matchLabels) && self.selector.matchLabels.size()
                > 0) || (has(self.selector.matchExpressions) && self.selector.matchExpressions.size()
                > 0)
            - message: each resolver step must set exactly one of env, file, or command
              rule: '!has(self.resolvers) || self.resolvers.all(r, (has(r.env) ? 1
                : 0) + (has(r.file) ? 1 : 0) + (has(r.command) ? 1 : 0) == 1)'
        type: object
        x-kubernetes-validations:
        - message: metadata.name must match ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ — emitted
            resource names are sanitized; the raw registry name lives in the one-shot-man/registry-name
            annotation
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
