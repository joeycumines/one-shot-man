---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelaccesses.one-shot-man
spec:
  group: one-shot-man
  names:
    kind: ModelAccess
    listKind: ModelAccessList
    plural: modelaccesses
    singular: modelaccess
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelAccess is the Identity analog: HOW to reach a provider — mode,
          user agent, anonymity, jurisdiction, auth — plus the concrete transport
          facts (endpoints per surface) and a preference order among accesses of the
          same provider (lower is more preferred). Cluster-scoped.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelAccessSpec describes one way of reaching a ModelProvider.
            properties:
              anonymous:
                default: false
                description: Anonymous is true when the access is usable without credentials.
                type: boolean
              auth:
                description: |-
                  Auth declares the authentication scheme and the environment variables
                  that must be covered by selector-matched LocalSecretBindings. Absent
                  means the access declares no credential needs.
                properties:
                  requiredEnv:
                    description: |-
                      RequiredEnv lists the environment variable names that must be resolved
                      before the access can launch. Coverage is checked by the engine against
                      the union of selector-matched LocalSecretBindings.
                    items:
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                    type: array
                    uniqueItems: true
                  scheme:
                    description: Scheme is the authentication scheme of the access.
                    enum:
                    - none
                    - bearer
                    - awsSigV4
                    - toolManaged
                    type: string
                required:
                - scheme
                type: object
              country:
                description: Country is the informative ISO country code of the access
                  pathway.
                maxLength: 3
                minLength: 2
                type: string
              deprecated:
                default: false
                description: |-
                  Deprecated marks an access no longer recommended for new tool
                  declarations.
                type: boolean
              endpoints:
                additionalProperties:
                  description: SurfaceEndpoint is the base URL a client resolves one
                    wire surface against.
                  minLength: 1
                  type: string
                description: |-
                  Endpoints maps each served surface to the base URL a client resolves
                  that surface against. A surface absent here cannot be used.
                type: object
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels are Kubernetes-compatible labels, mirroring metadata.labels.
                  LocalSecretBinding selectors match against them.
                type: object
              mode:
                default: direct
                description: |-
                  Mode is the access-mode enum: direct reaches the provider's own
                  endpoint(s); shaper routes through a local protocol-transcoding shaper;
                  proxy reserves a future HTTP egress pathway.
                enum:
                - direct
                - shaper
                - proxy
                type: string
              order:
                default: 100
                description: |-
                  Order is the preference among accesses of the same provider; lower is
                  more preferred.
                format: int32
                type: integer
              provider:
                description: |-
                  Provider references a ModelProvider by name. Must resolve; the
                  cross-resource check is a controller-side gap, not expressible in CEL.
                minLength: 1
                type: string
              user_agent:
                description: UserAgent models the User-Agent header policy for this
                  access.
                properties:
                  auto:
                    default: true
                    description: Auto is true when the client's default User-Agent
                      is acceptable.
                    type: boolean
                  force:
                    default: false
                    description: Force is true when Value MUST be sent regardless
                      of client defaults.
                    type: boolean
                  value:
                    default: ""
                    description: Value is the explicit header value used when Force
                      is true.
                    type: string
                type: object
            required:
            - provider
            type: object
            x-kubernetes-validations:
            - message: spec.endpoints must declare at least one served surface
              rule: '!has(self.endpoints) || self.endpoints.size() > 0'
            - message: spec.endpoints keys must be a served surface (responses|chat|anthropic)
              rule: '!has(self.endpoints) || self.endpoints.all(k, v, k in [''responses'',
                ''chat'', ''anthropic''])'
            - message: auth scheme bearer requires at least one requiredEnv entry
              rule: '!has(self.auth) || self.auth.scheme != ''bearer'' || (has(self.auth.requiredEnv)
                && self.auth.requiredEnv.size() > 0)'
            - message: auth scheme awsSigV4 requires both credential entries in requiredEnv
              rule: '!has(self.auth) || self.auth.scheme != ''awsSigV4'' || (has(self.auth.requiredEnv)
                && self.auth.requiredEnv.size() >= 2)'
            - message: auth scheme none must not declare requiredEnv
              rule: '!has(self.auth) || self.auth.scheme != ''none'' || !has(self.auth.requiredEnv)
                || self.auth.requiredEnv.size() == 0'
        type: object
        x-kubernetes-validations:
        - message: metadata.name must match ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ — emitted
            resource names are sanitized; the raw registry name lives in the one-shot-man/registry-name
            annotation
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
