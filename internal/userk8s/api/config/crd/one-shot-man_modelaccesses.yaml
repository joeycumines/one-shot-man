---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelaccesses.one-shot-man
spec:
  group: one-shot-man
  names:
    kind: ModelAccess
    listKind: ModelAccessList
    plural: modelaccesses
    singular: modelaccess
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelAccess is the Identity analog: HOW to reach a provider — mode,
          user agent, anonymity, jurisdiction, auth — plus the concrete transport
          facts (endpoints per surface) and a preference order among accesses of the
          same provider (lower is more preferred). Cluster-scoped.

          ## Spec-native configuration versus annotation-mapped configuration

          An access carries its configuration two ways, and the split is deliberate.

          A field in Spec is a fact THE CATALOG understands. The engine validates it
          (CEL on the CRD, plus the cross-resource checks in the loader), can
          cross-reference it against another field — auth_mode is only meaningful
          beside auth.requiredEnv — and can derive from it. ShaperConfig is the worked
          example: the gateway maps each field to exactly one ai-concurrency-shaper
          flag, refuses a shaper-mode access with no upstream, and validates the auth
          mode against the access's own credential slots. A wrong value is a registry
          defect the toolchain names, before anything is spawned.

          An annotation is a fact a CONSUMER understands and the CRD does not model.
          The motivating case is ai-concurrency-shaper
          (https://github.com/joeycumines/ai-concurrency-shaper), whose flag surface
          is large, vendor-owned, and moves independently of this API. Modelling its
          flags here would turn a catalog CRD into a mirror of an external binary's
          --help: every shaper release would either drift the schema or force an API
          change for a flag the catalog never needed semantically. An annotation has no
          schema, no CEL, and no regeneration, so adopting a new shaper flag is a data
          edit rather than an API change.

          `one-shot-man/shaper-args` is that annotation: a JSON array of strings
          appended, verbatim, to the ai-concurrency-shaper command line inside the
          access's mount (provider scope). It is the escape hatch for flags the
          product neither derives nor validates — `-opencode=true` on the opencode.ai
          mounts, for example. It is a string because every k8s annotation is a
          string, so the structure is encoded as JSON and MUST be validated by the
          consumer: the CRD cannot check it and this API deliberately does not
          pretend to.

          Every element is written in the `-flag=value` form, including booleans. A
          bare flag is not merely untidy: the shaper consumes the token after any
          value-taking flag written without `=`, so a bare element would swallow the
          NEXT mount's `--provider=` marker and merge the two mounts with no error
          reported. Requiring the `=` form makes that unrepresentable.

          The prefix is the API group, which is the Kubernetes convention for keys an
          API owns (the same reason metadata.name lives beside
          one-shot-man/registry-name rather than a vendor namespace): a consumer's own
          facts would use its own domain, as `example.com/owner` does in the module
          tests.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelAccessSpec describes one way of reaching a ModelProvider.
            properties:
              anonymous:
                default: false
                description: Anonymous is true when the access is usable without credentials.
                type: boolean
              auth:
                description: |-
                  Auth declares the authentication scheme and the environment variables
                  that must be covered by selector-matched LocalSecretBindings. Absent
                  means the access declares no credential needs.
                properties:
                  requiredEnv:
                    description: |-
                      RequiredEnv lists the environment variable names that must be resolved
                      before the access can launch. Coverage is checked by the engine against
                      the union of selector-matched LocalSecretBindings.
                    items:
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                    type: array
                    uniqueItems: true
                  scheme:
                    description: Scheme is the authentication scheme of the access.
                    enum:
                    - none
                    - bearer
                    - awsSigV4
                    - toolManaged
                    type: string
                required:
                - scheme
                type: object
              country:
                description: Country is the informative ISO country code of the access
                  pathway.
                maxLength: 3
                minLength: 2
                type: string
              deprecated:
                default: false
                description: |-
                  Deprecated marks an access no longer recommended for new tool
                  declarations.
                type: boolean
              endpoints:
                additionalProperties:
                  description: SurfaceEndpoint is the base URL a client resolves one
                    wire surface against.
                  minLength: 1
                  type: string
                description: |-
                  Endpoints maps each served surface to the base URL a client resolves
                  that surface against. A surface absent here cannot be used.
                type: object
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels are Kubernetes-compatible labels, mirroring metadata.labels.
                  LocalSecretBinding selectors match against them.
                type: object
              mode:
                default: direct
                description: |-
                  Mode is the access-mode enum: direct reaches the provider's own
                  endpoint(s); shaper routes through a local protocol-transcoding shaper;
                  proxy reserves a future HTTP egress pathway.
                enum:
                - direct
                - shaper
                - proxy
                type: string
              order:
                default: 100
                description: |-
                  Order is the preference among accesses of the same provider; lower is
                  more preferred.
                format: int32
                type: integer
              preferred_surface:
                description: |-
                  PreferredSurface names which served surface this access prefers when
                  mounted or resolved. Valid values: anthropic, responses, chat.
                  When absent, the product's standing surface preference applies.
                enum:
                - anthropic
                - responses
                - chat
                type: string
              provider:
                description: |-
                  Provider references a ModelProvider by name. Must resolve; the
                  cross-resource check is a controller-side gap, not expressible in CEL.
                minLength: 1
                type: string
              shaper:
                description: Shaper carries operational configuration for shaper-mode
                  accesses.
                properties:
                  auth_mode:
                    description: 'AuthMode is the upstream auth mode: auto, none,
                      bearer, x-api-key, api-key, header:NAME.'
                    type: string
                  cancel_cooldown:
                    description: CancelCooldown is the slot hold after client cancel
                      (-cancel-cooldown). Duration string.
                    type: string
                  cb_max_penalty:
                    description: CBMaxPenalty is the max phantom concurrency hold
                      time (-cb-max-penalty). Duration string.
                    type: string
                  cb_penalty:
                    description: CBPenalty is the base phantom concurrency hold time
                      (-cb-penalty). Duration string.
                    type: string
                  cb_threshold:
                    description: CBThreshold is failures within window to trip circuit
                      breaker (-cb-threshold).
                    format: int32
                    minimum: 1
                    type: integer
                  cb_window:
                    description: CBWindow is the failure counting window (-cb-window).
                      Duration string.
                    type: string
                  circuit_breaker:
                    description: CircuitBreaker enables the circuit breaker (-circuit-breaker).
                    type: boolean
                  concurrency:
                    description: Concurrency is the max concurrent limited requests
                      (-concurrency).
                    format: int32
                    minimum: 1
                    type: integer
                  limit_all:
                    description: LimitAll enables limiting all requests, not just
                      matching routes (-limit-all).
                    type: boolean
                  queue_timeout:
                    description: |-
                      QueueTimeout is the max time a request waits in the queue (-queue-timeout).
                      Duration string, e.g. "30m", "30s".
                    type: string
                  release_cooldown:
                    description: ReleaseCooldown is the delay after slot release before
                      re-admission (-release-cooldown). Duration string.
                    type: string
                  retry:
                    description: Retry is the max retries for limited requests (-retry).
                      Negative means unlimited.
                    format: int32
                    type: integer
                  retry_min_delay:
                    description: RetryMinDelay is the minimum delay before retrying
                      (-retry-min-delay). Duration string.
                    type: string
                  retry_skip_429:
                    description: RetrySkip429 skips retrying 429 responses (-retry-skip-429).
                    type: boolean
                  transcode:
                    description: 'Transcode is the transcode preset override: auto,
                      none, messages-chat.'
                    enum:
                    - auto
                    - none
                    - messages-chat
                    type: string
                  upstream:
                    description: |-
                      Upstream is the real upstream URL the shaper forwards to. The
                      spec.endpoints URLs are client-facing (naming the gateway's own
                      address), so this field carries the actual provider endpoint.
                      Required for shaper-mode accesses.
                    minLength: 1
                    type: string
                type: object
              surfaces:
                description: |-
                  Surfaces explicitly lists the wire surfaces served by this access.
                  When omitted, surfaces are derived from the keys of Endpoints.
                items:
                  enum:
                  - anthropic
                  - chat
                  - responses
                  type: string
                type: array
              user_agent:
                description: UserAgent models the User-Agent header policy for this
                  access.
                properties:
                  auto:
                    default: true
                    description: Auto is true when the client's default User-Agent
                      is acceptable.
                    type: boolean
                  force:
                    default: false
                    description: Force is true when Value MUST be sent regardless
                      of client defaults.
                    type: boolean
                  value:
                    default: ""
                    description: Value is the explicit header value used when Force
                      is true.
                    type: string
                type: object
            required:
            - provider
            type: object
            x-kubernetes-validations:
            - message: spec.endpoints must declare at least one served surface
              rule: '!has(self.endpoints) || self.endpoints.size() > 0'
            - message: spec.endpoints keys must be a served surface (responses|chat|anthropic)
              rule: '!has(self.endpoints) || self.endpoints.all(k, v, k in [''responses'',
                ''chat'', ''anthropic''])'
            - message: auth scheme bearer requires at least one requiredEnv entry
              rule: '!has(self.auth) || self.auth.scheme != ''bearer'' || (has(self.auth.requiredEnv)
                && self.auth.requiredEnv.size() > 0)'
            - message: auth scheme awsSigV4 requires both credential entries in requiredEnv
              rule: '!has(self.auth) || self.auth.scheme != ''awsSigV4'' || (has(self.auth.requiredEnv)
                && self.auth.requiredEnv.size() >= 2)'
            - message: auth scheme none must not declare requiredEnv
              rule: '!has(self.auth) || self.auth.scheme != ''none'' || !has(self.auth.requiredEnv)
                || self.auth.requiredEnv.size() == 0'
        type: object
        x-kubernetes-validations:
        - message: metadata.name must match ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ — emitted
            resource names are sanitized; the raw registry name lives in the one-shot-man/registry-name
            annotation
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
