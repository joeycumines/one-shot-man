---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: modelaccesses.one-shot-man
spec:
  group: one-shot-man
  names:
    kind: ModelAccess
    listKind: ModelAccessList
    plural: modelaccesses
    singular: modelaccess
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelAccess is one LOGICAL way of reaching a ModelProvider: the provider and
          the wire protocol. It carries no credentials, endpoints, transport, or
          models.

          Credentials are entity facts (LocalSecretBinding), and connection means are
          entity facts (ModelRoute). Keeping them off the access is what lets the same
          catalog be reached through a local shaper, a remote gateway, a sandbox
          tunnel, or a direct client without editing the logical catalog.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelAccessSpec is one logical provider/protocol channel.
            properties:
              deprecated:
                default: false
                description: Deprecated marks the access as no longer recommended
                  for new routes.
                type: boolean
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels are Kubernetes-compatible labels. Credential bindings select
                  accesses/providers by label; they never attach to models.
                type: object
              protocol:
                description: Protocol is the wire protocol the provider endpoint speaks
                  natively.
                enum:
                - chat
                - messages
                - responses
                type: string
              provider:
                description: |-
                  Provider references a ModelProvider by name. Must resolve; the
                  cross-resource check is a loader/controller-side gap.
                minLength: 1
                type: string
            required:
            - protocol
            - provider
            type: object
        type: object
        x-kubernetes-validations:
        - message: metadata.name must match ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
