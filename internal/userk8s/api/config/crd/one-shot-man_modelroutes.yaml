---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: modelroutes.one-shot-man
spec:
  group: one-shot-man
  names:
    kind: ModelRoute
    listKind: ModelRouteList
    plural: modelroutes
    singular: modelroute
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelRoute is one entity's access item: the provider access, the entity-held
          credential, the connection means, and the serving inventory exposed under
          this item. It is the tool-visible grouping level above model variants:
          credentials attach here, not to a Model.

          metadata.name is also the shaper section identity for a shaper transport, so
          several routes (accounts, regions, protocols) coexist in one suite.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelRouteSpec is one entity's exposure.
            properties:
              access:
                description: |-
                  Access names the logical ModelAccess this route dials. Required for
                  shaper and direct transports; absent for a remote inventory.
                minLength: 1
                type: string
              credential:
                description: |-
                  Credential names the LocalSecretBinding (same namespace) that supplies
                  the entity's credential for this access item. Optional for
                  credential-less accesses or remote transports.
                type: string
              endpoints:
                additionalProperties:
                  description: SurfaceEndpoint is the base URL a client resolves one
                    wire surface against.
                  minLength: 1
                  type: string
                description: Endpoints maps each served surface to the client base
                  URL.
                type: object
              naming:
                description: Naming declares how a client addresses a model on this
                  route.
                enum:
                - served
                - wire
                - registry
                - canonical
                type: string
              offers:
                description: |-
                  Offers is the serving inventory exposed under this access item. Empty on
                  a shaper/direct route means every serving of the access's provider.
                items:
                  description: RouteOffer binds one ModelServing to the id this route
                    exposes it under.
                  properties:
                    id:
                      description: ID is the served id; defaults to the serving's
                        metadata.name.
                      type: string
                    serving:
                      description: Serving is a ModelServing reference (metadata name
                        or registry key).
                      minLength: 1
                      type: string
                  required:
                  - serving
                  type: object
                  x-kubernetes-validations:
                  - message: offer.id must be an RFC-1123 name when set
                    rule: '!has(self.id) || size(self.id) == 0 || self.id.matches(''^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'')'
                type: array
              order:
                default: 100
                description: |-
                  Order is the preference among routes that expose the same offering;
                  lower is more preferred. Zero is the unset value and is rejected when
                  declared explicitly: the default replaces it with 100.
                format: int32
                minimum: 1
                type: integer
              surfaces:
                description: |-
                  Surfaces lists the client wire surfaces this route publishes. "gemini"
                  is the Google GenerateContent client surface (Antigravity CLI); a shaper
                  transport serves it by transcoding the request to the access protocol.
                items:
                  enum:
                  - anthropic
                  - chat
                  - responses
                  - gemini
                  type: string
                minItems: 1
                type: array
                uniqueItems: true
              transport:
                description: Transport names how this route reaches the access/service.
                properties:
                  kind:
                    description: Kind is direct, shaper, or remote.
                    enum:
                    - direct
                    - shaper
                    - remote
                    type: string
                  shaper:
                    description: Shaper carries the operating envelope for a shaper
                      transport.
                    properties:
                      auth_mode:
                        description: |-
                          AuthMode is the upstream auth mode: auto, none, bearer, x-api-key,
                          api-key, header:NAME.
                        minLength: 1
                        type: string
                      cancel_cooldown:
                        description: CancelCooldown is the slot hold after client
                          cancel (-cancel-cooldown).
                        type: string
                      cb_max_penalty:
                        description: CBMaxPenalty is the max phantom concurrency hold
                          time (-cb-max-penalty).
                        type: string
                      cb_penalty:
                        description: CBPenalty is the base phantom concurrency hold
                          time (-cb-penalty).
                        type: string
                      cb_threshold:
                        description: CBThreshold is failures within window to trip
                          circuit breaker (-cb-threshold).
                        format: int32
                        minimum: 1
                        type: integer
                      cb_window:
                        description: CBWindow is the failure counting window (-cb-window).
                        type: string
                      circuit_breaker:
                        description: CircuitBreaker enables the circuit breaker (-circuit-breaker).
                        type: boolean
                      concurrency:
                        description: Concurrency is the max concurrent limited requests
                          (-concurrency).
                        format: int32
                        minimum: 1
                        type: integer
                      limit_all:
                        description: LimitAll enables limiting all requests, not just
                          matching routes (-limit-all).
                        type: boolean
                      queue_timeout:
                        description: QueueTimeout is the max time a request waits
                          in the queue (-queue-timeout).
                        type: string
                      release_cooldown:
                        description: ReleaseCooldown is the delay after slot release
                          before re-admission (-release-cooldown).
                        type: string
                      retry:
                        description: Retry is the max retries for limited requests
                          (-retry).
                        format: int32
                        type: integer
                      retry_min_delay:
                        description: RetryMinDelay is the minimum delay before retrying
                          (-retry-min-delay).
                        type: string
                      retry_skip_429:
                        description: RetrySkip429 skips retrying 429 responses (-retry-skip-429).
                        type: boolean
                    type: object
                  upstream:
                    description: Upstream is the provider endpoint a shaper transport
                      dials.
                    minLength: 1
                    type: string
                required:
                - kind
                type: object
            required:
            - endpoints
            - naming
            - surfaces
            - transport
            type: object
            x-kubernetes-validations:
            - message: spec.surfaces must declare at least one client surface
              rule: self.surfaces.size() > 0
            - message: spec.surfaces items must be one of anthropic|chat|responses|gemini
              rule: self.surfaces.all(s, s in ['anthropic', 'chat', 'responses', 'gemini'])
            - message: spec.endpoints must declare exactly the surfaces in spec.surfaces
              rule: self.endpoints.size() == self.surfaces.size() && self.surfaces.all(s,
                s in self.endpoints) && self.endpoints.all(k, k in self.surfaces)
            - message: spec.endpoints values must be non-empty base URLs
              rule: self.endpoints.all(k, v, v.size() > 0)
            - message: shaper transport requires spec.access
              rule: self.transport.kind != 'shaper' || has(self.access)
            - message: direct transport requires spec.access
              rule: self.transport.kind != 'direct' || has(self.access)
            - message: shaper transport requires naming served
              rule: self.transport.kind != 'shaper' || self.naming == 'served'
            - message: direct transport requires naming wire
              rule: self.transport.kind != 'direct' || self.naming == 'wire'
            - message: shaper transport requires spec.transport.upstream
              rule: self.transport.kind != 'shaper' || has(self.transport.upstream)
            - message: spec.transport.shaper is only valid for shaper transport
              rule: self.transport.kind == 'shaper' || !has(self.transport.shaper)
            - message: a remote route must declare its offers inventory
              rule: self.transport.kind == 'shaper' || self.transport.kind == 'direct'
                || (has(self.offers) && self.offers.size() > 0)
        type: object
        x-kubernetes-validations:
        - message: metadata.name must match ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
