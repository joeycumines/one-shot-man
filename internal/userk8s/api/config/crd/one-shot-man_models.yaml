---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: models.one-shot-man
spec:
  group: one-shot-man
  names:
    kind: Model
    listKind: ModelList
    plural: models
    singular: model
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Model is a provider-independent definition of a model's configuration and
          capabilities. It carries no provider, access, credential, or wire id: those
          are facts of a ModelServing (a provider's offer) and a ModelRoute (an
          entity's exposure). A canonical Model is the equivalence class; offerings
          that narrow its capabilities reference it instead of duplicating it.
          Cluster-scoped.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelSpec is the fact sheet of one model a provider offers.
            properties:
              aliases:
                description: |-
                  Aliases are additional selection aliases for this Model (raw ids,
                  old spellings, provider-neutral names). Aliases are a naming aid, not a
                  second identity.
                items:
                  type: string
                type: array
              canonical_id:
                description: |-
                  CanonicalID is the provider-independent identity of the model, e.g.
                  "zhipuai/glm-5.3". It is the grouping key across providers and the value
                  a canonical-naming route can expose. It is NOT the wire id.
                maxLength: 256
                minLength: 1
                type: string
              context_window:
                description: |-
                  ContextWindow is the canonical context budget in tokens. A ModelServing
                  may narrow it, never widen it.
                format: int64
                minimum: 1
                type: integer
              deprecated:
                default: false
                description: |-
                  Deprecated marks the model itself as no longer recommended. A deprecated
                  Model hides every serving unless one is explicitly pinned.
                type: boolean
              display_name:
                description: DisplayName is the human-readable model name (e.g. "GLM-5.3").
                minLength: 1
                type: string
              family:
                description: |-
                  Family is the model family/line (e.g. "glm"), when the catalog publishes
                  one.
                type: string
              input_modalities:
                default:
                - text
                description: InputModalities lists the input modalities the model
                  accepts.
                items:
                  enum:
                  - text
                  - image
                  - audio
                  type: string
                type: array
                uniqueItems: true
              labels:
                additionalProperties:
                  type: string
                description: Labels are Kubernetes-compatible labels, mirroring metadata.labels.
                type: object
              max_output_tokens:
                description: |-
                  MaxOutputTokens is the canonical maximum output budget in tokens. A
                  ModelServing may narrow it, never widen it.
                format: int64
                minimum: 1
                type: integer
              output_modalities:
                default:
                - text
                description: OutputModalities lists the output modalities the model
                  produces.
                items:
                  enum:
                  - text
                  - image
                  - audio
                  type: string
                type: array
                uniqueItems: true
              reasoning:
                description: |-
                  Reasoning is the model's reasoning capability: whether it reasons, the
                  selectable modes, exact effort tiers, and token-budget range.
                properties:
                  budget:
                    description: |-
                      Budget is the accepted token-budget range when the provider exposes
                      Anthropic-style thinking budgets.
                    properties:
                      max:
                        description: Max is the largest budget the provider accepts,
                          in tokens.
                        format: int64
                        minimum: 1
                        type: integer
                      min:
                        description: Min is the smallest budget the provider accepts,
                          in tokens.
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: reasoning.budget.min must be non-negative
                      rule: '!has(self.min) || self.min >= 0'
                    - message: reasoning.budget.max must be positive
                      rule: '!has(self.max) || self.max > 0'
                    - message: reasoning.budget.min must not exceed reasoning.budget.max
                      rule: '!has(self.min) || !has(self.max) || self.min <= self.max'
                  efforts:
                    description: |-
                      Efforts is the exact set of reasoning effort levels the provider
                      accepts, in the provider's declared order.
                    items:
                      enum:
                      - none
                      - minimal
                      - low
                      - medium
                      - high
                      - xhigh
                      - max
                      - ultra
                      type: string
                    type: array
                    uniqueItems: true
                  supported:
                    default: false
                    description: Supported is true when the model supports reasoning/thinking
                      at all.
                    type: boolean
                  toggle:
                    default: false
                    description: Toggle is true when the provider accepts an explicit
                      on/off choice.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: 'a reasoning mode requires supported: true'
                  rule: self.supported || (!self.toggle && !has(self.efforts) && !has(self.budget))
                - message: reasoning.efforts items must be one of none|minimal|low|medium|high|xhigh|max|ultra
                  rule: '!has(self.efforts) || self.efforts.all(e, e in [''none'',
                    ''minimal'', ''low'', ''medium'', ''high'', ''xhigh'', ''max'',
                    ''ultra''])'
              structured_output:
                default: false
                description: |-
                  StructuredOutput is true when the model accepts structured output
                  constraints.
                type: boolean
              tool_call:
                default: true
                description: ToolCall is true when the model accepts tool/function
                  calls.
                type: boolean
              toolSettings:
                additionalProperties:
                  description: |-
                    ModelToolSettings holds sparse per-tool settings overriding the model's
                    hard facts for one tool. A setting that exceeds a fact requires a non-empty
                    waive reason; the compromise is then explicit and auditable.
                  properties:
                    auto_compact_window:
                      description: |-
                        AutoCompactWindow overrides how much context the tool compacts at.
                        Exceeding the model's context_window requires a waive reason.
                      format: int64
                      type: integer
                    context_window:
                      description: |-
                        ContextWindow overrides the context budget for this tool. Exceeding
                        the model's context_window requires a waive reason.
                      format: int64
                      type: integer
                    effort_level:
                      description: |-
                        EffortLevel pins the reasoning effort this tool requests. When the
                        model publishes its accepted levels, the value must be one of them.
                      type: string
                    flags:
                      additionalProperties:
                        type: string
                      description: Flags carries tool-specific boolean or string knobs
                        by name.
                      type: object
                    max_output_tokens:
                      description: |-
                        MaxOutputTokens overrides the output budget for this tool. Exceeding
                        the model's max_output_tokens requires a waive reason.
                      format: int64
                      type: integer
                    waive:
                      description: |-
                        Waive is the reason a budget override intentionally exceeds the
                        model's hard fact. Required for such overrides.
                      type: string
                  type: object
                description: ToolSettings holds sparse per-tool overrides keyed by
                  tool name.
                type: object
            required:
            - canonical_id
            - context_window
            - display_name
            - max_output_tokens
            type: object
            x-kubernetes-validations:
            - message: spec.context_window must be positive — the provider-enforced
                context ceiling in tokens
              rule: self.context_window > 0
            - message: spec.max_output_tokens must be positive — the provider-enforced
                maximum output budget in tokens
              rule: self.max_output_tokens > 0
            - message: spec.input_modalities items must be one of text|image|audio
              rule: '!has(self.input_modalities) || self.input_modalities.all(m, m
                in [''text'', ''image'', ''audio''])'
            - message: spec.reasoning.efforts items must be one of none|minimal|low|medium|high|xhigh|max|ultra
              rule: '!has(self.reasoning) || !has(self.reasoning.efforts) || self.reasoning.efforts.all(e,
                e in [''none'', ''minimal'', ''low'', ''medium'', ''high'', ''xhigh'',
                ''max'', ''ultra''])'
            - message: spec.output_modalities items must be one of text|image|audio
              rule: '!has(self.output_modalities) || self.output_modalities.all(m,
                m in [''text'', ''image'', ''audio''])'
            - message: tool settings context_window must be positive and must not
                exceed the model context_window without a waive reason
              rule: '!has(self.toolSettings) || self.toolSettings.all(k, v, !has(v.context_window)
                || (v.context_window > 0 && (v.context_window <= self.context_window
                || (has(v.waive) && v.waive.size() > 0))))'
            - message: tool settings max_output_tokens must be positive and must not
                exceed the model max_output_tokens without a waive reason
              rule: '!has(self.toolSettings) || self.toolSettings.all(k, v, !has(v.max_output_tokens)
                || (v.max_output_tokens > 0 && (v.max_output_tokens <= self.max_output_tokens
                || (has(v.waive) && v.waive.size() > 0))))'
            - message: tool settings auto_compact_window must be positive and must
                not exceed the model context_window without a waive reason
              rule: '!has(self.toolSettings) || self.toolSettings.all(k, v, !has(v.auto_compact_window)
                || (v.auto_compact_window > 0 && (v.auto_compact_window <= self.context_window
                || (has(v.waive) && v.waive.size() > 0))))'
            - message: tool settings effort_level must be one of none|minimal|low|medium|high|xhigh|max|ultra
              rule: '!has(self.toolSettings) || self.toolSettings.all(k, v, !has(v.effort_level)
                || v.effort_level in [''none'', ''minimal'', ''low'', ''medium'',
                ''high'', ''xhigh'', ''max'', ''ultra''])'
            - message: tool settings effort_level must be one of the model's published
                reasoning.efforts
              rule: '!has(self.toolSettings) || self.toolSettings.all(k, v, !has(v.effort_level)
                || !has(self.reasoning) || !has(self.reasoning.efforts) || v.effort_level
                in self.reasoning.efforts)'
        type: object
        x-kubernetes-validations:
        - message: metadata.name must match ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ — emitted
            resource names are sanitized; the raw registry model id lives in the one-shot-man/registry-name
            annotation
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
