apiVersion: one-shot-man/v1alpha1
kind: LocalSecretBinding
metadata:
  name: bind-camel-shaper
  namespace: model-access-personal
spec:
  envVar: CAMEL_API_KEY
  resolvers:
  - command:
      argv:
      - op
      - item
      - get
      - 4v6bzjb2lprdaqtgjxrrg4wlga
