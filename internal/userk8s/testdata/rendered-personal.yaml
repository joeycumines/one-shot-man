apiVersion: one-shot-man/v1alpha1
kind: ModelProvider
metadata:
  name: alpha
spec:
  display_name: Alpha
  country: us
---
apiVersion: one-shot-man/v1alpha1
kind: ModelProvider
metadata:
  name: beta
spec:
  display_name: Beta
---
apiVersion: one-shot-man/v1alpha1
kind: ModelAccess
metadata:
  name: alpha-chat
  labels:
    one-shot-man/provider: alpha
spec:
  provider: alpha
  protocol: chat
---
apiVersion: one-shot-man/v1alpha1
kind: ModelAccess
metadata:
  name: beta-chat
  labels:
    one-shot-man/provider: beta
spec:
  provider: beta
  protocol: chat
---
apiVersion: one-shot-man/v1alpha1
kind: Model
metadata:
  name: alpha-model
  annotations:
    one-shot-man/registry-name: alpha-model
spec:
  canonical_id: alpha/alpha-model
  display_name: Alpha Model
  context_window: 100000
  max_output_tokens: 1000
  reasoning:
    supported: true
    efforts:
      - low
      - high
  input_modalities:
    - text
    - image
---
apiVersion: one-shot-man/v1alpha1
kind: Model
metadata:
  name: beta-model
spec:
  canonical_id: beta/beta-model
  display_name: Beta Model
  context_window: 200000
  max_output_tokens: 2000
  input_modalities:
    - text
---
apiVersion: one-shot-man/v1alpha1
kind: ModelServing
metadata:
  name: alpha-model-alpha
spec:
  provider: alpha
  model: alpha-model
  provider_model_id: alpha-model
  default: true
  overrides:
    context_window: 100000
    max_output_tokens: 1000
    input_modalities:
      - text
      - image
    reasoning:
      supported: true
      efforts:
        - low
        - high
---
apiVersion: one-shot-man/v1alpha1
kind: ModelServing
metadata:
  name: beta-model-beta
  annotations:
    one-shot-man/registry-name: beta-model:beta
spec:
  provider: beta
  model: beta-model
  provider_model_id: beta-model
  overrides:
    context_window: 200000
    max_output_tokens: 2000
    input_modalities:
      - text
    reasoning:
      supported: false
---
apiVersion: one-shot-man/v1alpha1
kind: LocalSecretBinding
metadata:
  name: bind-alpha
  namespace: model-access-test
spec:
  selector:
    matchLabels:
      one-shot-man/provider: alpha
  scheme: bearer
  secretRef:
    name: creds
    key: ALPHA_API_KEY
  envVar: ALPHA_API_KEY
  resolvers:
    - command:
        argv:
          - fake-op
          - item
          - get
          - alpha
        timeout: 60s
    - env:
        name: SHELL_AI_ALPHA_API_KEY
---
apiVersion: one-shot-man/v1alpha1
kind: LocalSecretBinding
metadata:
  name: bind-beta
  namespace: model-access-test
spec:
  selector:
    matchLabels:
      one-shot-man/provider: beta
  scheme: bearer
  secretRef:
    name: creds
    key: BETA_API_KEY
  envVar: BETA_API_KEY
  resolvers:
    - env:
        name: SHELL_AI_BETA_API_KEY
---
apiVersion: one-shot-man/v1alpha1
kind: Tool
metadata:
  name: claude
spec:
  display_name: Claude Code
  surfaces:
    - anthropic
  credential_channels:
    - gateway
    - env
  identifiers:
    provider_slug:
      pattern: ^[a-z0-9][a-z0-9-]*$
    model_slug:
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:\[\]-]*$
  budget_profile: claude-margin
---
apiVersion: one-shot-man/v1alpha1
kind: Tool
metadata:
  name: opencode
spec:
  display_name: OpenCode
  surfaces:
    - anthropic
    - chat
  credential_channels:
    - gateway
    - envRef
    - env
  identifiers:
    provider_slug:
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    model_slug:
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
  budget_profile: sdk-limits
---
apiVersion: one-shot-man/v1alpha1
kind: ModelSelection
metadata:
  name: alpha-selection
  namespace: model-access-test
spec:
  display_name: Alpha selection
  strategy: ordered
  candidates:
    - serving: alpha-model-alpha
---
apiVersion: one-shot-man/v1alpha1
kind: ModelRoute
metadata:
  name: alpha-local
  namespace: model-access-test
spec:
  access: alpha-chat
  credential: bind-alpha
  surfaces:
    - chat
  endpoints:
    chat: http://127.0.0.1:11239/alpha/v1
  naming: served
  order: 10
  transport:
    kind: shaper
    upstream: https://alpha.example
